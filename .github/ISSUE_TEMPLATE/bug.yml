name: Bug report
description: Report unexpected behavior without sharing secrets
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, app version, sample vs provider data. Do not include tokens or personal data.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and non-sensitive logs
