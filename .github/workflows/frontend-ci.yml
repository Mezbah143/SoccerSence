name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install free open-source dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        env:
          FOOTBALL_API_KEY: SOCCERSENSE_TEST_ONLY_SECRET_SENTINEL
        run: npm run build
      - name: Audit public build boundary and JavaScript budget
        run: npm run audit:public
      - name: Build local data gateway
        run: npm run build:server
      - name: Guard against bundled API credentials
        run: |
          if grep -r -q -E 'SOCCERSENSE_TEST_ONLY_SECRET_SENTINEL|FOOTBALL_API_KEY|X-Auth-Token|BEGIN PRIVATE KEY' dist --include='*.js' --include='*.html'; then
            echo 'Possible secret marker found in generated client bundle!'
            exit 1
          fi
